name: terraform
on:
  pull_request:                      # which event? we want this on review, not on merge
    paths: ["infra/**"]

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # mint the OIDC (OpenID Connect) token to assume the AWS role
      contents: read         # check out the repo
      pull-requests: write   # post the plan as a comment on the PR a PR comment
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::817210751918:role/gha-ci-basics-deploy
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
        working-directory: infra

      - run: terraform init
        working-directory: infra

      - run: terraform validate
        working-directory: infra

      - name: plan
        id: plan
        shell: bash
        run: terraform plan -no-color -var home_cidr=${{ vars.HOME_CIDR }} 2>&1 | tee plan.txt
        working-directory: infra

      - name: comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const body = `#### \`terraform plan\` — \`${{ job.status }}\`\n\n<details><summary>show plan</summary>\n\n\`\`\`terraform\n${plan.slice(-60000)}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });