name: hello

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


jobs:
  first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: now what is here
        run: ls -la
      - name: leave a file behind
        run: echo "built by job first" > artifact.txt

  second:
    runs-on: ubuntu-latest
    needs: first
    steps:
      - name: can I see the other job's file
        run: cat artifact.txt || echo "NO SHARED DISK"

  parallel_one:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 10 && echo "I did not wait for anyone"